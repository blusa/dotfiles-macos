# Paleta: tokyonight night (matchea wezterm, tmux, nvim y borders)
format = """\
[](bg:#1a1b26 fg:#9ece6a)\
[󰀵 ](bg:#9ece6a fg:#1a1b26)\
[](fg:#9ece6a bg:#414868)\
$time\
[](fg:#414868 bg:#7aa2f7)\
$directory\
[](fg:#7aa2f7 bg:#e0af68)\
$git_branch\
$git_status\
$git_metrics\
[](fg:#e0af68 bg:#1a1b26)\
$cmd_duration\
$character\
"""

[directory]
format = "[ $path ]($style)"
style = "fg:#1a1b26 bg:#7aa2f7"

[git_branch]
format = '[ $symbol$branch(:$remote_branch) ]($style)'
symbol = "  "
style = "fg:#1a1b26 bg:#e0af68"

[git_status]
format = '[$all_status]($style)'
style = "fg:#1a1b26 bg:#e0af68"

[git_metrics]
format = "([+$added]($added_style))[]($added_style)"
added_style = "fg:#1a1b26 bg:#e0af68"
deleted_style = "fg:#f7768e bg:#1a1b26"
disabled = false

[cmd_duration]
format = "[  $duration ]($style)"
style = "fg:#e0af68"

[character]
success_symbol = '[ ➜](bold #9ece6a) '
error_symbol = '[ ✗](#f7768e) '

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#414868"
format = '[[ 󱑍 $time ](bg:#414868 fg:#7dcfff)]($style)'
